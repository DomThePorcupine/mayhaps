[project]
name = "mayhaps"
version = "0.1.5"
description = "Usable monads for Python"
readme = "README.md"
authors = [
    { name = "Dominic DiPasquale", email = "dominic.dipasquale@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
pydantic = ["pydantic>=2.0"]
sqlalchemy = ["sqlalchemy>=2.0"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "httpx2>=2.3.0",
    "pydantic>=2.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0",
]

[tool.pytest.ini_options]
addopts = "--cov=mayhaps --cov-report=term-missing"

[tool.coverage.run]
source = ["mayhaps"]

[tool.coverage.report]
show_missing = true
