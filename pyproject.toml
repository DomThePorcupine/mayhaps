[project]
name = "mayhaps"
version = "0.1.0"
description = "Usable monads for Python"
readme = "README.md"
authors = [
    { name = "Dominic DiPasquale", email = "dominic.dipasquale@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=mayhaps --cov-report=term-missing"

[tool.coverage.run]
source = ["mayhaps"]

[tool.coverage.report]
show_missing = true
